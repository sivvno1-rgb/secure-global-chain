[project]
name = "secure-global-chain-backend"
version = "0.1.0"
description = "Backend for Secure Global Chain — identity + audit kernel (security core)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy[asyncio]>=2.0.29",
    "alembic>=1.13",
    "pyjwt>=2.8",
    "cryptography>=42",
    "asyncpg>=0.29",
    "httpx>=0.27",
    "uvicorn>=0.29",
    "numpy>=1.26",
    "scipy>=1.11",
    "ortools>=9.8",
    "celery>=5.3",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "aiosqlite>=0.20",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Ship the operator frontend (served at GET / and /static/*) inside the wheel;
# without this `pip install .` drops the non-Python files and StaticFiles fails.
[tool.setuptools.package-data]
sgc = ["static/*", "static/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
